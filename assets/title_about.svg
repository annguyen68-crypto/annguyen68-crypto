<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="ABOUT ME">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/><stop offset=".55" stop-color="#0A1630"/><stop offset="1" stop-color="#0F2150"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#60A5FA" opacity=".12"/>
    </pattern>
    <radialGradient id="glow" cx=".8" cy=".45" r=".5">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".35"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .in{opacity:0;animation:in .8s ease-out forwards}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s ease-out both}
      .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s ease-out forwards}
      .sweep{animation:sweep 4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes sweep{0%{transform:translateX(-200px);opacity:0}30%{opacity:.9}100%{transform:translateX(1250px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.in,.grow,.draw,.sweep{animation:none;opacity:1;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="64" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="64" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="63" rx="18" fill="none" stroke="#3B82F6" stroke-opacity=".3"/>
  <rect class="sweep" x="0" y="62" width="160" height="2" fill="url(#acc)"/>
  <rect x="0" y="12" width="5" height="40" rx="2.5" fill="url(#accv)"/>
  <text x="30" y="40" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#60A5FA">01</text>
  <text x="66" y="41" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">ABOUT ME</text>
  <text x="1170" y="40" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8FA8CF">Finance background, analytics toolkit</text>
</svg>
