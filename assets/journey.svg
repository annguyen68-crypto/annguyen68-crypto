<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Career journey">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/><stop offset=".55" stop-color="#0A1630"/><stop offset="1" stop-color="#0F2150"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#60A5FA" opacity=".12"/>
    </pattern>
    <radialGradient id="glow" cx=".8" cy=".45" r=".5">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".35"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .in{opacity:0;animation:in .8s ease-out forwards}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s ease-out both}
      .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s ease-out forwards}
      .sweep{animation:sweep 4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes sweep{0%{transform:translateX(-200px);opacity:0}30%{opacity:.9}100%{transform:translateX(1250px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.in,.grow,.draw,.sweep{animation:none;opacity:1;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="230" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="230" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="18" fill="none" stroke="#3B82F6" stroke-opacity=".3"/>
  <text x="60" y="48" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">My journey</text>
  <line x1="150" y1="120" x2="1050" y2="120" stroke="#3B82F6" stroke-opacity=".2" stroke-width="3"/>
  <line class="draw" x1="150" y1="120" x2="1050" y2="120" stroke="url(#acc)" stroke-width="3"/>
  <g class="in" style="animation-delay:0.30s"><circle cx="150" cy="120" r="9" fill="#0B1A3A" stroke="#60A5FA" stroke-width="3"/>
    <text x="150" y="88" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#60A5FA">2020 – 2024</text>
    <text x="150" y="162" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">B.Sc. Finance &amp; Banking</text>
    <text x="150" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">Univ. of Finance &amp; Marketing</text></g>
  <g class="in" style="animation-delay:0.65s"><circle cx="375" cy="120" r="9" fill="#0B1A3A" stroke="#60A5FA" stroke-width="3"/>
    <text x="375" y="88" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#60A5FA">09/2022 – 03/2025</text>
    <text x="375" y="162" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Teaching Assistant</text>
    <text x="375" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">Dai Truong Phat · iMap English</text></g>
  <g class="in" style="animation-delay:1.00s"><circle cx="600" cy="120" r="9" fill="#0B1A3A" stroke="#60A5FA" stroke-width="3"/>
    <text x="600" y="88" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#60A5FA">10/2023 – 02/2024</text>
    <text x="600" y="162" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Corporate Clients Executive</text>
    <text x="600" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">Asia Commercial Bank (ACB)</text></g>
  <g class="in" style="animation-delay:1.35s"><circle cx="825" cy="120" r="9" fill="#0B1A3A" stroke="#60A5FA" stroke-width="3"/>
    <text x="825" y="88" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#60A5FA">03/2025 – 08/2026</text>
    <text x="825" y="162" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Operations Executive &amp; PA</text>
    <text x="825" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">Junius International – Sweeto</text></g>
  <g class="in" style="animation-delay:1.70s"><circle class="pulse" cx="1050" cy="120" r="16" fill="#2563EB" opacity=".5"/><circle cx="1050" cy="120" r="9" fill="#60A5FA" stroke="#60A5FA" stroke-width="3"/>
    <text x="1050" y="88" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#60A5FA">2026 – Now</text>
    <text x="1050" y="162" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Data Analytics</text>
    <text x="1050" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">SQL · Python · Tableau projects</text></g>

</svg>
