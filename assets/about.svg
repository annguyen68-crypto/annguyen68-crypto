<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="About Nguyen Thuy An">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/><stop offset=".55" stop-color="#0A1630"/><stop offset="1" stop-color="#0F2150"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#60A5FA" opacity=".12"/>
    </pattern>
    <radialGradient id="glow" cx=".8" cy=".45" r=".5">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".35"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .in{opacity:0;animation:in .8s ease-out forwards}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s ease-out both}
      .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s ease-out forwards}
      .sweep{animation:sweep 4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes sweep{0%{transform:translateX(-200px);opacity:0}30%{opacity:.9}100%{transform:translateX(1250px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.in,.grow,.draw,.sweep{animation:none;opacity:1;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="18" fill="none" stroke="#3B82F6" stroke-opacity=".3"/>
  <text x="60" y="76" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Finance graduate, operations background</text>
  <rect class="sweep" x="60" y="90" width="60" height="3" rx="1.5" fill="url(#acc)" style="animation:none"/>
  <text x="60" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#CBD9F0">Finance &amp; Banking graduate with 1.5 years in operations: reconciling</text><text x="60" y="144" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#CBD9F0">records in Excel, checking invoices against purchase orders, and pulling</text><text x="60" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#CBD9F0">figures from several teams into monthly reports for management.</text><text x="60" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#CBD9F0">Now I use SQL, Python and Tableau to turn raw business data into</text><text x="60" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#CBD9F0">clean, reliable numbers and clear recommendations.</text>
  <g class="in" style="animation-delay:0.50s"><circle cx="68" cy="255" r="9" fill="#2563EB"/><path d="M63 255 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="88" y="260" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Data quality &amp; reconciliation</text>
    <text x="88" y="280" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">Cross-checking invoices, POs, goods received and inventory records</text></g>
  <g class="in" style="animation-delay:0.70s"><circle cx="68" cy="301" r="9" fill="#2563EB"/><path d="M63 301 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="88" y="306" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">SQL analysis</text>
    <text x="88" y="326" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">KPI trees and Pareto / ABC with window functions on 6.76M rows</text></g>
  <g class="in" style="animation-delay:0.90s"><circle cx="68" cy="347" r="9" fill="#2563EB"/><path d="M63 347 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="88" y="352" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Reporting &amp; dashboards</text>
    <text x="88" y="372" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">Monthly management reports · Tableau Public dashboard</text></g>
  <g class="in" style="animation-delay:0.30s"><rect x="740" y="60" width="200" height="124" rx="12" fill="#0B1A3A" stroke="#3B82F6" stroke-opacity=".4"/>
    <text x="760" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#60A5FA">OPERATIONS</text>
    <text x="760" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">1.5 yrs</text>
    <text x="760" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8FA8CF">Ops Executive · PA to Director</text></g>
  <g class="in" style="animation-delay:0.48s"><rect x="955" y="60" width="200" height="124" rx="12" fill="#0B1A3A" stroke="#3B82F6" stroke-opacity=".4"/>
    <text x="975" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#60A5FA">SQL PROJECT</text>
    <text x="975" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">6.76M</text>
    <text x="975" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8FA8CF">transactions cleaned &amp; validated</text></g>
  <g class="in" style="animation-delay:0.66s"><rect x="740" y="200" width="200" height="124" rx="12" fill="#0B1A3A" stroke="#3B82F6" stroke-opacity=".4"/>
    <text x="760" y="232" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#60A5FA">MOS EXCEL</text>
    <text x="760" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">962</text>
    <text x="760" y="302" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8FA8CF">out of 1000</text></g>
  <g class="in" style="animation-delay:0.84s"><rect x="955" y="200" width="200" height="124" rx="12" fill="#0B1A3A" stroke="#3B82F6" stroke-opacity=".4"/>
    <text x="975" y="232" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#60A5FA">IELTS</text>
    <text x="975" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">6.5</text>
    <text x="975" y="302" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8FA8CF">Writing 7.5 · daily English at work</text></g>
  <line x1="60" y1="388" x2="1155" y2="388" stroke="#3B82F6" stroke-opacity=".25"/>
  <text x="60" y="412" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">MOS Word 825 · The Next Banker – Corporate Clients (ACB) · Tableau Public</text>
  <text x="1155" y="412" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#CBD9F0">📍 Ho Chi Minh City, Viet Nam   <tspan fill="#86EFAC">● Open to data analyst roles</tspan></text>
</svg>
