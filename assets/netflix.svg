<svg xmlns="http://www.w3.org/2000/svg" width="580" height="280" viewBox="0 0 580 280" role="img" aria-label="Netflix Content Catalog Analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/><stop offset=".55" stop-color="#0A1630"/><stop offset="1" stop-color="#0F2150"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#60A5FA" opacity=".12"/>
    </pattern>
    <radialGradient id="glow" cx=".8" cy=".45" r=".5">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".35"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .in{opacity:0;animation:in .8s ease-out forwards}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s ease-out both}
      .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s ease-out forwards}
      .sweep{animation:sweep 4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes sweep{0%{transform:translateX(-200px);opacity:0}30%{opacity:.9}100%{transform:translateX(1250px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.in,.grow,.draw,.sweep{animation:none;opacity:1;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="580" height="280" rx="18" fill="url(#bg)"/>
  <rect width="580" height="280" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="579" height="279" rx="18" fill="none" stroke="#3B82F6" stroke-opacity=".3"/>
  <rect width="580" height="280" rx="18" fill="url(#glow)"/>
  <rect x="0" y="24" width="5" height="50" rx="2.5" fill="url(#accv)"/>
  <text x="40" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">Netflix Content Catalog Analysis</text>
  <text x="40" y="82" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" fill="#60A5FA">Python · Pandas · NumPy · Seaborn</text>
  <g class="in" style="animation-delay:0.30s"><text x="40" y="150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">8,807</text>
    <text x="40" y="174" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">titles cleaned</text></g>
  <g class="in" style="animation-delay:0.50s"><text x="215" y="150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">8</text>
    <text x="215" y="174" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">business questions</text></g>
  <g class="in" style="animation-delay:0.70s"><text x="390" y="150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">5</text>
    <text x="390" y="174" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA8CF">recommendations</text></g>
  <line x1="40" y1="200" x2="540" y2="200" stroke="#3B82F6" stroke-opacity=".25"/>
  <text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD9F0">Exploratory analysis of the full catalog</text>
  <rect class="grow" style="animation-delay:0.40s" x="430" y="234" width="12" height="20" rx="2" fill="#3B82F6" opacity=".75"/><rect class="grow" style="animation-delay:0.50s" x="446" y="220" width="12" height="34" rx="2" fill="#3B82F6" opacity=".75"/><rect class="grow" style="animation-delay:0.60s" x="462" y="226" width="12" height="28" rx="2" fill="#3B82F6" opacity=".75"/><rect class="grow" style="animation-delay:0.70s" x="478" y="208" width="12" height="46" rx="2" fill="#3B82F6" opacity=".75"/><rect class="grow" style="animation-delay:0.80s" x="494" y="216" width="12" height="38" rx="2" fill="#3B82F6" opacity=".75"/><rect class="grow" style="animation-delay:0.90s" x="510" y="199" width="12" height="55" rx="2" fill="#3B82F6" opacity=".75"/><rect class="grow" style="animation-delay:1.00s" x="526" y="212" width="12" height="42" rx="2" fill="#3B82F6" opacity=".75"/>
</svg>
